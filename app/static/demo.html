<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<title>Agent credit exchange: demo</title>
<style>
  :root { --bg:#F6F7F9; --card:#fff; --ink:#121826; --mute:#5B6472; --line:#E3E6EB; --blue:#2453C4; --blue-soft:#E7EEFB;
          --green:#157347; --green-soft:#EAF6EF; --red:#B4232B; --red-soft:#FDECEC; --navy:#0F1B2D; --ios-blue:#0A66D8; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--navy); color:#fff; padding:9px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header .brand { font-weight:800; font-size:17px; }
  header label { display:flex; align-items:center; gap:8px; font-size:13px; color:#C9D3E3; }
  header select { font:inherit; font-size:14px; padding:5px 8px; border-radius:8px; border:1px solid #52627A; background:#1C2C44; color:#fff; max-width:270px; }
  nav { display:flex; gap:8px; margin-left:auto; }
  nav button { width:34px; height:34px; border-radius:50%; border:1px solid #52627A; background:transparent; color:#E6ECF5; font:inherit; font-weight:700; cursor:pointer; }
  nav button[aria-current="step"] { background:#fff; color:var(--navy); border-color:#fff; }
  #src { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; padding:5px 12px; border-radius:99px; background:#2A3A52; color:#C9D3E3; }
  #src i { width:9px; height:9px; border-radius:50%; background:#8A96A8; }
  #src.live { background:#E3F5EA; color:#0E5233; } #src.live i { background:#1F9D55; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .intro { text-align:center; padding:14px 20px 0; }
  .intro h1 { margin:0; font-size:32px; font-weight:800; letter-spacing:-.02em; }
  .intro p { margin:2px 0 0; font-size:17px; color:var(--mute); }
  .seg { display:inline-flex; background:#E6E9EE; border-radius:99px; padding:3px; margin-top:10px; }
  .seg button { font:inherit; font-size:14px; font-weight:700; border:0; background:transparent; color:var(--mute); padding:6px 16px; border-radius:99px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(16,36,62,.15); }
  main { flex:1; min-height:0; width:100%; max-width:1300px; margin:0 auto; padding:16px 28px;
         display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:28px; align-items:start; }
  .lane { display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  .lane-t { text-align:center; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 28px 14px; max-width:1300px; width:100%; margin:0 auto; }
  footer .fine { font-size:12px; color:var(--mute); }
  footer button { font:inherit; font-weight:700; min-height:46px; padding:0 22px; border-radius:12px; cursor:pointer; }
  #next { background:var(--blue); color:#fff; border:0; display:inline-flex; gap:8px; align-items:center; }
  #back { background:#fff; color:var(--blue); border:1px solid #C9D8F5; }
  body[data-view="b"] main, body[data-view="l"] main { display:none; }
  #persp, #phoneView { flex:1; min-height:0; display:none; align-items:center; justify-content:center; padding:8px 28px; }
  body[data-view="l"] #persp { display:flex; }
  body[data-view="b"] #phoneView { display:flex; gap:44px; }
  body[data-view="b"] #steps { visibility:hidden; } body[data-view="b"] footer { display:none; }
  body[data-view="b"] #phoneView { align-items:stretch; padding:12px 28px 18px; }
  @media (max-width:1000px) { body { overflow:auto; display:block; } main { grid-template-columns:1fr; } body[data-view="b"] #phoneView { flex-direction:column; } }

  /* everyone view */
  .tile { position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 16px;
          display:flex; align-items:center; gap:12px; transition:opacity .6s, filter .6s, border-color .6s, background .6s; }
  .tile.ok { border:2px solid var(--green); } .tile.bad { border:2px solid var(--red); }
  .tile.warn { border:2px solid #C98A00; background:#FFF8E6; }
  .tile.dead { opacity:.4; filter:grayscale(1); } .tile.won { border:2px solid var(--green); background:var(--green-soft); }
  .ico { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--blue-soft); color:var(--blue); }
  .ico.round { border-radius:50%; } .ico.grey { background:#EEF0F3; color:var(--mute); } .ico.red { background:var(--red-soft); color:var(--red); }
  .tname { font-weight:700; font-size:16px; } .tsub { font-size:13px; color:var(--mute); }
  .big { font-size:30px; font-weight:800; letter-spacing:-.02em; margin-left:auto; }
  .say { font-size:14px; font-style:italic; }
  /* the market has up to seven lenders: compact tiles so they all fit on a laptop screen */
  #L { gap:8px; } #L .tile { padding:7px 14px; } #L .ico { width:34px; height:34px; border-radius:10px; }
  #L .tname { font-size:15px; } #L .big { font-size:23px; } #L .tile .stamp { font-size:13px; top:-9px; }
  #hub { align-self:center; display:flex; flex-direction:column; align-items:center; gap:5px; }
  #hub .shield { width:76px; height:76px; border-radius:22px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; transition:background .5s; }
  #hub.bad .shield { background:var(--red); } #hub.good .shield { background:var(--green); }
  #hubSt { font-size:15px; font-weight:700; color:var(--mute); min-height:21px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 16px; position:relative; }
  .grid { display:grid; gap:9px 8px; align-items:center; }
  .grid .lbl { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; }
  .grid .lbl .ico { width:34px; height:34px; border-radius:10px; }
  .grid .hd { text-align:center; font-size:13px; font-weight:700; color:var(--mute); }
  .res { display:flex; flex-direction:column; align-items:center; font-size:12px; color:var(--mute); }
  .badge { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#EEF0F3; color:var(--mute); flex-shrink:0; }
  .badge.good { background:var(--green); color:#fff; } .badge.bad { background:var(--red); color:#fff; }
  .spin { width:20px; height:20px; border-radius:50%; border:3px solid #C9D8F5; border-top-color:var(--blue); animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .vs { display:flex; align-items:center; justify-content:center; gap:16px; } .vs .n { font-size:38px; font-weight:800; letter-spacing:-.03em; }
  .vs .cap { font-size:13px; color:var(--mute); text-align:center; }
  .doc-h { display:flex; align-items:center; gap:8px; font-weight:700; } .doc-t { font-size:19px; font-weight:800; margin:4px 0 6px; }
  .bars i { display:block; height:7px; border-radius:4px; background:#EEF0F3; margin:5px 0; } .bars i:nth-child(2) { width:85%; } .bars i:nth-child(3) { width:60%; }
  .hidden-line { color:#FBFBFB; font-size:7px; line-height:1.3; transition:all 1.4s ease; border-radius:10px; }
  .hidden-line.shown { color:#7E1218; font-size:14px; font-weight:600; background:var(--red-soft); padding:8px 10px; margin-top:4px; }
  .doc-cap { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px; font-weight:700; color:var(--mute); } .doc-cap.alarm { color:var(--red); }
  .thread { display:flex; flex-direction:column; gap:6px; }
  .thread .hd { display:flex; justify-content:space-between; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .bub { max-width:85%; padding:5px 12px; border-radius:14px; font-size:13px; white-space:nowrap; }
  .bub b { font-size:18px; margin-right:6px; }
  .bub.me { align-self:flex-start; background:var(--blue-soft); color:#13306F; border-bottom-left-radius:4px; }
  .bub.them { align-self:flex-end; background:#EEF0F3; border-bottom-right-radius:4px; }
  .bub.yes { background:var(--green); color:#fff; }
  .note { font-size:14px; color:var(--mute); text-align:center; padding:10px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700; padding:4px 12px; border-radius:99px; background:#EEF0F3; }

  /* lender dashboard */
  .dev-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; max-height:100%; }
  .dev-label { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .dash { width:820px; max-width:100%; height:440px; border-radius:16px; border:1px solid var(--line); background:#fff; overflow:hidden;
          display:flex; flex-direction:column; box-shadow:0 18px 40px rgba(16,36,62,.14); }
  .dash-top { background:var(--navy); color:#fff; padding:11px 16px; display:flex; align-items:center; gap:10px; font-size:14px; }
  .dash-top span { color:#C9D3E3; } .dash.evil .dash-top { background:#5C1015; }
  .simtag { margin-left:auto; font-size:11px; font-weight:700; color:#6B4700 !important; background:#FFF4D6; border-radius:4px; padding:1px 6px; }
  .dash-body { flex:1; min-height:0; padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .dcard { border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .dcard h3 { margin:0; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .redact { display:inline-block; background:#121826; color:transparent; border-radius:3px; user-select:none; }
  .kv2 { display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:15px; } .kv2 .v { font-weight:700; text-align:right; }
  .verdict-bad { border:2px solid var(--red); background:var(--red-soft); color:#7E1218; }
  .verdict-ok { border:2px solid var(--green); background:var(--green-soft); color:#0E5233; }
  .code { font-family:ui-monospace,Consolas,monospace; font-size:13px; font-weight:700; }
  .p-row { display:flex; align-items:center; gap:10px; }

  /* iPhone */
  .iphone { position:relative; height:100%; max-height:640px; align-self:center; aspect-ratio:9 / 19.3; border-radius:54px; padding:11px;
            background:linear-gradient(145deg, #2B2D31, #0E0F11); box-shadow:0 0 0 2px #3A3C40, 0 24px 60px rgba(16,36,62,.32); flex-shrink:0; }
  .iphone::before { content:""; position:absolute; left:-4px; top:22%; width:4px; height:58px; border-radius:3px 0 0 3px; background:#2B2D31;
                    box-shadow:0 70px 0 #2B2D31; }   /* volume buttons */
  .iphone::after { content:""; position:absolute; right:-4px; top:28%; width:4px; height:86px; border-radius:0 3px 3px 0; background:#2B2D31; } /* side button */
  .screen { position:relative; height:100%; border-radius:44px; overflow:hidden; background:#F2F2F7; display:flex; flex-direction:column;
            font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif; }
  .island { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:31%; height:26px; border-radius:20px; background:#000; z-index:3; }
  .status { height:46px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 6px 30px; font-size:14px; font-weight:600; }
  .status .ic { display:flex; gap:5px; align-items:center; }
  .app { flex:1; min-height:0; overflow-y:auto; padding:6px 14px 26px; scrollbar-width:none; display:flex; flex-direction:column; gap:10px; }
  .app::-webkit-scrollbar { display:none; } .app > *, #app > div > * { flex-shrink:0; }
  .homebar { position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:36%; height:5px; border-radius:3px; background:#111; z-index:3; }
  .ios-sub { font-size:13px; color:#6C6C70; }
  .ios-title { font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .ios-sec { font-size:12px; font-weight:600; color:#6C6C70; text-transform:uppercase; letter-spacing:.04em; margin:4px 4px -4px; }
  .ios-group { background:#fff; border-radius:13px; overflow:hidden; }
  .ios-row { display:flex; align-items:center; gap:10px; padding:10px 12px; font-size:15px; border-top:.5px solid #E2E2E7; min-height:44px; }
  .ios-row:first-child { border-top:0; }
  .ios-row .k { flex:1; } .ios-row .v { font-weight:700; }
  .stepper { display:flex; align-items:center; gap:8px; }
  .stepper button { width:30px; height:30px; border-radius:50%; border:0; background:#E9E9EE; font-size:18px; font-weight:700; color:var(--ios-blue); cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--ios-blue); }
  .ios-row select { font:inherit; border:0; background:transparent; color:var(--ios-blue); font-weight:600; text-align:right; }
  .switch { position:relative; width:46px; height:28px; flex-shrink:0; }
  .switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1; }
  .switch span { position:absolute; inset:0; border-radius:99px; background:#E9E9EA; transition:background .3s; }
  .switch span::after { content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:left .3s; }
  .switch input:checked + span { background:#34C759; } .switch input:checked + span::after { left:20px; }
  .switch input:focus-visible + span { outline:2px solid var(--ios-blue); outline-offset:2px; }
  .ios-btn { font:inherit; font-size:17px; font-weight:700; border:0; border-radius:14px; background:var(--ios-blue); color:#fff; min-height:50px; cursor:pointer; }
  .ios-btn:disabled { opacity:.45; cursor:default; }
  .ios-btn.dock { position:sticky; bottom:0; box-shadow:0 -10px 16px #F2F2F7, 0 6px 14px rgba(10,102,216,.3); }
  .ios-row { padding:8px 12px; min-height:42px; }
  .ios-btn.ghost { background:#fff; color:var(--ios-blue); }
  .wants { display:flex; flex-wrap:wrap; gap:5px; }
  .wants span { font-size:12px; font-weight:700; background:#fff; border-radius:99px; padding:3px 9px; }
  .steps .ios-row .st { width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .steps .done { color:#34C759; } .steps .fail { color:#FF3B30; } .steps .wait { width:12px; height:12px; border-radius:50%; border:2px solid #C7C7CC; }
  .steps .ios-row.off { color:#A1A1A6; }
  .orow b { margin-left:auto; } .orow.dead { color:#A1A1A6; } .orow .red { color:#FF3B30; }
  .alert { background:#FFF0EF; border:1.5px solid #FF3B30; color:#8E1C14; border-radius:13px; padding:10px 12px; font-size:14px; }
  .good-card { background:#fff; border:2px solid #34C759; border-radius:13px; padding:12px; }
  .big-pay { font-size:38px; font-weight:800; letter-spacing:-.03em; line-height:1.1; }

  /* iMessage-style chat with the agent */
  .app.chatmode { padding:0; overflow:hidden; gap:0; }
  /* colors as tokens so the phone can follow the iPhone's own light/dark setting, like iMessage */
  .chat { --c-bg:#fff; --c-them:#E9E9EB; --c-them-fg:#000; --c-fg:#000; --c-sub:#8E8E93; --c-pill:rgba(242,242,247,.72);
          --c-pill-fg:#000; --c-line:#D1D1D6; --c-field:#fff; --c-card:#F2F2F7; --c-chip:#0A84FF; --c-fade:255,255,255;
          position:relative; display:flex; flex-direction:column; height:100%; background:var(--c-bg); color:var(--c-fg); }
  /* like iMessage: avatar + name pill float over the conversation; messages scroll underneath, fading out at the top */
  .chat-h { position:absolute; top:0; left:0; right:0; z-index:2; display:flex; flex-direction:column; align-items:center; gap:5px;
            padding:8px 12px 18px; pointer-events:none;
            background:linear-gradient(rgba(var(--c-fade),.96) 0%, rgba(var(--c-fade),.82) 60%, rgba(var(--c-fade),0) 100%); }
  .chat-h > * { pointer-events:auto; }
  .chat-h .av { width:50px; height:50px; border-radius:50%; background:linear-gradient(160deg,#6AAEF8,#1C64D8); color:#fff; display:flex;
                align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .pill { display:inline-flex; align-items:center; gap:4px; border-radius:99px; background:var(--c-pill); color:var(--c-pill-fg);
          -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px); box-shadow:0 1px 6px rgba(0,0,0,.12); }
  .chat-h .nm { font-size:14px; font-weight:600; padding:4px 12px; }
  .chat-h .side { position:absolute; top:8px; height:36px; padding:0 12px; font-size:14px; font-weight:600; }
  .chat-h .side.l { left:10px; } .chat-h .side.r { right:10px; }
  .chat-h .side select { position:absolute; inset:0; opacity:0; width:100%; font-size:16px; }  /* tap the pill: the iPhone's own picker opens */
  .chat-h .dot { width:8px; height:8px; border-radius:50%; background:#30D158; }
  .msgs { flex:1; min-height:0; overflow-y:auto; padding:96px 10px 6px; display:flex; flex-direction:column; gap:3px; scrollbar-width:none; }
  .msgs::-webkit-scrollbar { display:none; }
  .msgs > * { flex-shrink:0; }  /* bubbles and cards keep their full height; the conversation scrolls instead */
  .sysnote { align-self:center; text-align:center; font-size:12px; color:var(--c-sub); margin:4px 0 8px; }
  .sysnote button { font:inherit; color:var(--c-chip); background:none; border:0; padding:0; cursor:pointer; }
  .msg { max-width:78%; padding:7px 12px; border-radius:18px; font-size:15px; line-height:1.3; word-wrap:break-word; white-space:pre-wrap; }
  .msg.them { align-self:flex-start; background:var(--c-them); color:var(--c-them-fg); border-bottom-left-radius:5px; }
  .msg.me { align-self:flex-end; background:#0A84FF; color:#fff; border-bottom-right-radius:5px; }
  .msg + .msg.me, .msg.me + .msg.them, .msg.them + .msg.me { margin-top:6px; }
  .msg.typing { display:flex; gap:4px; padding:11px 13px; }
  .msg.typing i { width:7px; height:7px; border-radius:50%; background:#9B9BA0; animation:dot 1.2s infinite; }
  .msg.typing i:nth-child(2) { animation-delay:.2s; } .msg.typing i:nth-child(3) { animation-delay:.4s; }
  @keyframes dot { 0%, 60%, 100% { opacity:.35; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  .plan { align-self:stretch; margin:8px 2px 4px; border-radius:18px; padding:14px; background:var(--c-card); display:flex; flex-direction:column; gap:8px; }
  .plan .t { font-size:13px; font-weight:700; color:var(--c-sub); text-transform:uppercase; letter-spacing:.04em; }
  .plan .r { display:flex; justify-content:space-between; font-size:15px; } .plan .r b { font-weight:700; }
  .plan .fine { font-size:12px; color:var(--c-sub); }
  /* suggestions are quick replies at the end of the conversation (they scroll with it), not a fixed strip */
  .chips { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; padding:8px 0 2px; align-self:stretch; }
  .chips:empty { display:none; }
  .chips button { font:inherit; font-size:14px; white-space:nowrap; border:1px solid var(--c-chip); background:transparent; color:var(--c-chip); border-radius:99px; padding:6px 12px; cursor:pointer; }
  .composer { display:flex; align-items:center; gap:8px; padding:6px 10px 26px; background:var(--c-bg); }
  body[data-mode="phone"] .composer { padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .composer input { flex:1; min-width:0; font:inherit; font-size:15px; border:1px solid var(--c-line); background:var(--c-field); color:var(--c-fg);
                    border-radius:20px; padding:8px 14px; outline:none; }
  .composer input::placeholder { color:var(--c-sub); }
  .composer input:focus { border-color:#0A84FF; }
  .composer button { width:32px; height:32px; border-radius:50%; border:0; background:#0A84FF; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .composer button:disabled { background:#C7C7CC; }
  /* on a real phone: iOS-size text, and dark mode when the iPhone is in dark mode */
  body[data-mode="phone"] .msg { font-size:17px; padding:8px 13px; }
  body[data-mode="phone"] .composer input { font-size:17px; }
  body[data-mode="phone"] .detail .msg { font-size:14px; padding:5px 10px; }
  @media (prefers-color-scheme: dark) {
    body[data-mode="phone"] .chat { --c-bg:#000; --c-them:#26252A; --c-them-fg:#fff; --c-fg:#fff; --c-sub:#8D8D93; --c-pill:rgba(44,44,46,.72);
      --c-pill-fg:#fff; --c-line:#3A3A3C; --c-field:#000; --c-card:#1C1C1E; --c-chip:#409CFF; --c-fade:0,0,0; }
  }
  /* cards the agent posts in the chat while it shops (progress, offers, deal); rows open details when tapped */
  .chat { --c-alert:#FFF0EF; --c-alert-fg:#8E1C14; --c-ok:#34C759; }

  out.push(h("div", {class: "dnote"}, "Your agent can show a lender a rival's offer; the exchange checks it's real and passes it on without the rival's name."));
  return out;
}
function detailDone() {
  const deal = D.ex.deal, ev = D.ex.events, dis = ev.find(x => x.kind === "disclosure"), set = ev.find(x => x.kind === "settlement"), none = ev.find(x => x.kind === "no_deal");
  if (!deal) return [h("div", {}, none ? none.data.reason : "No offer fit your limits."),
    ...replies(0).filter(e => e.data.type === "OFFER" && !isInjected(e.data)).map(e => drow(LENDERS[e.data.sender], `${pct(e.data.terms.apr)} · ${money(monthly(e.data.terms.amount, e.data.terms.apr, e.data.terms.term_months))}/mo`)),
    h("div", {class: "dnote"}, "Your agent never accepts anything outside your limits, even if that means no loan.")];
  const t = deal.terms;
  return [drow("Lender", deal.lender_name), drow("Amount", money(t.amount)), drow("Rate", pct(t.apr)), drow("Length", `${t.term_months} months`),
    drow("Monthly payment", money(dis ? dis.data.monthly_payment : monthly(t.amount, t.apr, t.term_months))),
    dis ? drow("Total interest and fees", money(dis.data.total_interest_and_fees, 2)) : null, drow("Autopay", t.autopay ? "yes" : "no"),
    ...(dis ? [h("div", {class: "dh"}, "In plain English"), ...dis.data.summary.map(s => h("div", {}, s))] : []),
    ...(set ? [h("div", {class: "dh"}, "Next steps (simulated)"), ...set.data.steps.map(s => h("div", {class: "dnote"}, "• " + s.replace(/: simulated \(not available in the CRS sandbox\)$/, "")))] : [])];
}

async function phoneRun() {
  const id = ++run; speed = 1;
  try { await phoneStory(); } catch (e) { if (e !== STOP) throw e; }
  finally { if (id === run) speed = 1; }
}
async function phoneStory() {
  $("#log").replaceChildren();
  const STEPS = ["Checking your details", "Shopping", "Negotiating", "Done"];
  const rows = STEPS.map(s => h("div", {class: "ios-row off"}, h("span", {class: "st"}, h("span", {class: "wait"})), h("span", {class: "k"}, s)));
  const DETAILS = [detailChecks, detailShopping, detailNegotiation, detailDone];
  const setStep = (i, state) => { const r = rows[i]; r.classList.toggle("off", state === "wait");
    r.firstChild.replaceChildren(state === "run" ? h("span", {class: "spin"}) : state === "ok" ? h("span", {class: "done"}, icon("check", 20))
      : state === "fail" ? h("span", {class: "fail"}, icon("x", 20)) : h("span", {class: "wait"}));
    if (state === "ok" || state === "fail") tappable(r, DETAILS[i]); };  // a finished step can be opened for details
  const area = h("div", {style: "display:flex;flex-direction:column;gap:10px"});
  app().classList.remove("chatmode"); document.body.classList.remove("chatting");
  app().replaceChildren(h("div", {}, h("div", {class: "ios-sub"}, "You asked for"), wantsChips()),
    h("div", {class: "ios-title", style: "font-size:22px"}, "Your agent is shopping"), h("div", {class: "ios-group steps"}, rows), area);
  const gate = D.ex.events.find(e => e.kind === "gate").data;
  // 1. identity and credit
  setStep(0, "run");
  logAdd("Agent → CRS", `Checked identity and credit: ${gate.crs_products.length} CRS checks (AtData fraud risk, TransUnion identity, phone owner, 3 credit bureaus).`, "", "id");
  await wait(2200);
  if (!D.ex.admitted) {
    setStep(0, "fail");
    await add(area, tappable(h("div", {class: "alert"}, h("b", {}, "We couldn't verify your identity."), h("div", {}, gate.headline + ". No lender has seen your application.")), detailChecks));
    logAdd("Referee", "Stopped at the gate: identity checks failed. No lender sees anything.", "bad", "shield");
    return;
  }
  setStep(0, "ok");
  const s = scoreOf(D.P);
  logAdd("CRS", s == null ? "Identity verified. No credit score on file." : `Identity verified. Credit score ${s}.`, "good", "check");
  await wait(700);
  // 2. shopping
  setStep(1, "run");
  logAdd("Agent → lenders", `Sent a credit passport to ${D.lenderIds.length} lenders. Name, SSN and address stay hidden.`, "", "hidden");
  const list = await add(area, h("div", {class: "ios-group"}, h("div", {class: "ios-row ios-sub"}, "Offers")));
  for (const e of replies(0)) {
    const d = e.data, off = d.type === "OFFER", inj = off && isInjected(d);
    await wait(900);
    await add(list, tappable(h("div", {class: "ios-row orow" + (off ? "" : " dead")}, icon("bank", 16), LENDERS[d.sender] || d.sender,
      off ? h("b", {class: inj ? "red" : ""}, pct(d.terms.apr), inj ? [" ", icon("warn", 14)] : null) : h("b", {}, "declined")), () => detailOffer(d)));
    logAdd(LENDERS[d.sender] || d.sender, off ? `Offered ${pct(d.terms.apr)} for ${d.terms.term_months} months${inj ? ", with a hidden instruction in the text" : ""}.` : "Declined.",
      inj ? "bad" : "", "bank");
  }
  const atk = attackMsg();
  if (atk) {
    await wait(1200);
    logAdd("Agent", `Tried to accept ${pct(atk.data.terms.apr)} from ${LENDERS[atk.data.to]}: it obeyed the hidden instruction.`, "bad", "robot");
    await wait(1300);
    const br = breach(atk.data.terms);
    const al = await add(area, tappable(h("div", {class: "alert"}, h("b", {}, "Blocked a risky offer"),
      h("div", {}, `${LENDERS[atk.data.to]} hid an instruction telling your agent to accept ${pct(atk.data.terms.apr)} (${br.what === "monthly limit" ? br.offer : "that rate"}). That's over your ${br.limit} limit, so the exchange stopped it. Nothing was signed.`)),
      () => detailBlocked(atk)));
    shake(al);
    logAdd("Referee", `Blocked: ${br.offer} is over the ${br.limit} limit (${atk.verdict.code}).`, "bad", "shield");
    await wait(1800);
  }
  setStep(1, "ok");
  // 3. negotiating with the focus lender; the best-so-far card updates as offers improve
  setStep(2, "run");
  const lid = focusLender(), after = (atk || {round: 0}).round;
  const open = D.msgs.find(e => e.round === 0 && e.data.sender === lid && e.data.type === "OFFER");
  if (open) {
    const t0 = open.data.terms, pay = h("div", {class: "big-pay"}, money(monthly(t0.amount, t0.apr, t0.term_months))), rate = h("b", {}, pct(t0.apr));
    await add(area, h("div", {class: "ios-group"}, h("div", {class: "ios-row"}, h("span", {class: "k ios-sub"}, `Best so far · ${LENDERS[lid]}`), rate),
      h("div", {class: "ios-row"}, pay, h("span", {class: "ios-sub"}, "/ month"))));
    let prev = t0.apr;
    for (const e of D.msgs.filter(x => x.round > after && (x.data.sender === lid || x.data.to === lid))) {
      const d = e.data;
      await wait(1100);
      if (d.sender === "borrower" && d.type === "COUNTER") logAdd(`Agent → ${LENDERS[lid]}`, `Asked for ${pct(d.terms.apr)}${d.terms.autopay ? " with autopay" : ""}.`, "", "chat");
      else if (d.type === "OFFER") {
        logAdd(LENDERS[lid], `Agreed to ${pct(d.terms.apr)}.`, "", "bank");
        await Promise.all([countTo(rate, prev, d.terms.apr, 1200, pct),
          countTo(pay, monthly(d.terms.amount, prev, d.terms.term_months), monthly(d.terms.amount, d.terms.apr, d.terms.term_months), 1200, n => money(n))]);
        prev = d.terms.apr;
      }
    }
  }
  setStep(2, "ok");
  // 4. done
  const deal = D.ex.deal, dis = D.ex.events.find(x => x.kind === "disclosure");
  if (!deal) {
    setStep(3, "fail");
    await add(area, tappable(h("div", {class: "alert"}, h("b", {}, "No offer fit your limits"), h("div", {}, "Your agent walked away instead of breaking your rules. "
      + (M.max_payment ? "A higher monthly limit or a longer loan may get an offer." : `Raising your highest rate above ${M.max_apr}% may get an offer.`))), detailDone));
    logAdd("Agent", "Walked away: nothing fit the limits.", "", "robot");
    const back = h("button", {type: "button", class: "ios-btn ghost"}, "Change what I want"); back.onclick = () => (M.max_payment ? chatView() : phoneForm()); await add(area, back);
    return;
  }
  setStep(3, "ok");
  const t = deal.terms, saved = dis && dis.data.summary.join(" ").match(/saves \$([\d,.]+)/), traded = dis ? dis.data.summary.slice(1).filter(x => !/saves/.test(x)) : [];
  logAdd(`Agent → ${deal.lender_name}`, `Accepted ${pct(t.apr)}: inside every limit.`, "good", "check");
  const card = await add(area, h("div", {class: "good-card"}, h("div", {class: "ios-sub"}, `${deal.lender_name} · simulated lender`),
    h("div", {class: "big-pay"}, money(dis ? dis.data.monthly_payment : monthly(t.amount, t.apr, t.term_months)), h("span", {class: "ios-sub", style: "font-size:15px"}, " / month")),
    h("div", {}, `${money(t.amount)} at ${pct(t.apr)} for ${t.term_months} months`),
    saved ? h("div", {style: "color:#248A3D;font-weight:700"}, `Saved $${saved[1]} vs the best first offer`) : null,
    traded.map(x => h("div", {class: "ios-sub"}, x)), h("div", {class: "ios-sub", style: "color:var(--ios-blue);font-weight:600"}, "Tap for the full breakdown")));
  tappable(card, detailDone);
  pop(card);
}

// ------------------------------------------------------------------ scenes + controls
const SCENES = [
  {title: () => "Who's real?", caption: () => D.F ? "A real file next to a fake one. CRS data tells them apart." : "CRS identity and fraud data check every applicant.", fn: scene1, lfn: lScene1},
  {title: () => "Offers arrive", caption: () => `Lenders see a passport, not ${first(D.P.name)}'s identity.`, fn: scene2, lfn: lScene2},
  {title: () => "An attack", caption: () => "A hidden instruction tricks the agent.", fn: scene3, lfn: lScene3},
  {title: () => "The deal", caption: () => "Negotiated inside the limits.", fn: scene4, lfn: lScene4},
];
$("#steps").replaceChildren(...SCENES.map((s, i) => { const b = h("button", {type: "button", "aria-label": `Scene ${i + 1}`}, String(i + 1)); b.onclick = () => goTo(i); return b; }));
let view = "all";
// /phone = the borrower app alone on a real phone; /demo?follow=1 = the laptop mirrors whatever the phone runs.
const MODE = location.pathname.startsWith("/phone") ? "phone" : "desk";
const FOLLOW = MODE === "desk" && new URLSearchParams(location.search).get("follow") === "1";
if (MODE === "phone") { document.body.dataset.mode = "phone"; view = "b"; document.body.dataset.view = "b"; }
// iPhone keyboard (like iMessage): fit the page to the area above the keyboard and keep it from scrolling away, so
// the conversation fills everything between the floating header and the message box.
if (MODE === "phone" && window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    document.body.style.height = vv.height + "px";
    if (window.scrollY) window.scrollTo(0, 0);
    const m = document.querySelector(".msgs"); if (m) m.scrollTop = m.scrollHeight;
  };
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", () => { if (window.scrollY) window.scrollTo(0, 0); });
  fit();
}

async function follow() {
  const info = await get("/api/pair/info").catch(() => ({ip: location.hostname}));
  const url = `http://${info.ip}:${location.port || 80}/phone`;
  let seq = (await get("/api/pair?after=999999999").catch(() => ({seq: 0}))).seq;  // replay only sessions started from now on
  run++;
  $("#title").textContent = "Waiting for the phone...";
  $("#caption").textContent = `On a phone on this network, open ${url}`;
  app().classList.remove("chatmode"); document.body.classList.remove("chatting");
  app().replaceChildren(h("div", {style: "margin:auto;text-align:center"}, h("div", {class: "ios-title", style: "font-size:20px"}, "Waiting for the phone"),
    h("div", {class: "ios-sub"}, url)));
  $("#log").replaceChildren(h("li", {class: "empty"}, "When someone taps Start shopping on the phone, the same session plays here."));
  for (;;) {
    await new Promise(r => setTimeout(r, 700));
    let p; try { p = await get(`/api/pair?after=${seq}`); } catch (e) { continue; }
    if (!p.ex || p.seq <= seq) continue;
    seq = p.seq;
    D = {P: p.P, F: p.F, pid: p.pid}; useExchange(p.ex); M = p.M;
    $("#who").value = p.pid; $("#segB").textContent = first(D.P.name);
    if (view !== "b") { view = "b"; document.body.dataset.view = "b"; document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === "b"))); }
    $("#title").textContent = `${first(D.P.name)}'s phone`;
    $("#caption").textContent = "Live from the phone: same session, same numbers.";
    phoneRun();
  }
}

async function goTo(n) {
  n = Math.max(0, Math.min(SCENES.length - 1, n));
  if (!D.ex) return;
  if (view === "b") return showPhone();
  const id = ++run; cur = n;
  [...$("#steps").children].forEach((b, i) => i === n ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
  $("#title").textContent = SCENES[n].title(); $("#caption").textContent = SCENES[n].caption();
  $("#nextLbl").textContent = n < SCENES.length - 1 ? "Next" : "Start over";
  $("#back").disabled = n === 0;
  try {
    speed = 0; reset();
    if (view === "l") { speed = 1; await SCENES[n].lfn(); return; }
    for (let i = 0; i < n; i++) await SCENES[i].fn();
    speed = 1; await SCENES[n].fn();
  } catch (e) { if (e !== STOP) throw e; }
  finally { if (id === run) speed = 1; }
}
function showPhone() {
  $("#title").textContent = `${first(D.P.name)}'s phone`;
  $("#caption").textContent = "Tell the agent what you need, then let it shop.";
  chatView();
}
function setView(v) {
  view = v; document.body.dataset.view = v;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  goTo(cur);
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setView(b.dataset.view));
$("#next").onclick = () => goTo(cur < SCENES.length - 1 ? cur + 1 : 0);
$("#back").onclick = () => goTo(cur - 1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, button, textarea") || view === "b") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goTo(cur < SCENES.length - 1 ? cur + 1 : 0); }
  else if (e.key === "ArrowLeft") goTo(cur - 1);
  else if (e.key === "r" || e.key === "R") goTo(cur);
});
$("#who").onchange = async () => {
  run++; $("#title").textContent = "Pulling CRS data..."; $("#caption").textContent = "";
  try { await loadPerson($("#who").value); } catch (err) { $("#title").textContent = "Couldn't load that person"; $("#caption").textContent = err.message; return; }
  $("#segB").textContent = first(D.P.name);
  cur = 0; goTo(0);
};

(async () => {
  $("#title").textContent = LIVE ? "Pulling live CRS data..." : "Loading...";
  try {
    const [people, sc] = await Promise.all([get("/api/personas"), get("/api/exchange/scenarios")]);
    LENDERS = sc.lenders || {}; PEOPLE = people.personas;
    $("#who").replaceChildren(...PEOPLE.map(p => h("option", {value: p.id}, `${p.name} · ${LABEL[p.crs_expected] || p.crs_expected}`)));
    $("#who").value = new URLSearchParams(location.search).get("who") || "P03";
    await loadPerson($("#who").value);
    $("#segB").textContent = first(D.P.name);
    if (FOLLOW) { setView("b"); follow(); } else goTo(0);
  } catch (err) {
    $("#title").textContent = "Couldn't load the market";
    $("#caption").textContent = err.message + ". Is the server running?";
  }
})();
</script>
