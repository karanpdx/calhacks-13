<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent credit exchange: demo</title>
<style>
  :root { --bg:#F6F7F9; --card:#fff; --ink:#121826; --mute:#5B6472; --line:#E3E6EB; --blue:#2453C4; --blue-soft:#E7EEFB;
          --green:#157347; --green-soft:#EAF6EF; --red:#B4232B; --red-soft:#FDECEC; --navy:#0F1B2D; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--navy); color:#fff; padding:10px 28px; display:flex; align-items:center; gap:16px; }
  header .brand { font-weight:800; font-size:17px; }
  nav { display:flex; gap:8px; margin-left:auto; }
  #src { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; padding:5px 12px; border-radius:99px; background:#2A3A52; color:#C9D3E3; }
  #src i { width:9px; height:9px; border-radius:50%; background:#8A96A8; }
  #src.live { background:#E3F5EA; color:#0E5233; } #src.live i { background:#1F9D55; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  nav button { width:34px; height:34px; border-radius:50%; border:1px solid #52627A; background:transparent; color:#E6ECF5; font:inherit; font-weight:700; cursor:pointer; }
  nav button[aria-current="step"] { background:#fff; color:var(--navy); border-color:#fff; }
  .intro { text-align:center; padding:18px 20px 0; }
  .intro h1 { margin:0; font-size:34px; font-weight:800; letter-spacing:-.02em; }
  .intro p { margin:4px 0 0; font-size:18px; color:var(--mute); }
  main { flex:1; min-height:0; width:100%; max-width:1300px; margin:0 auto; padding:18px 28px;
         display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:28px; align-items:start; }
  .lane { display:flex; flex-direction:column; gap:14px; align-items:stretch; }
  .lane-t { text-align:center; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 28px 16px; max-width:1300px; width:100%; margin:0 auto; }
  footer .fine { font-size:12px; color:var(--mute); }
  footer button { font:inherit; font-weight:700; min-height:46px; padding:0 22px; border-radius:12px; cursor:pointer; }
  #next { background:var(--blue); color:#fff; border:0; display:inline-flex; gap:8px; align-items:center; }
  #back { background:#fff; color:var(--blue); border:1px solid #C9D8F5; }
  @media (max-width:1000px) { body { overflow:auto; display:block; } main { grid-template-columns:1fr; } }

  .tile { position:relative; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px;
          display:flex; align-items:center; gap:14px; transition:opacity .6s, filter .6s, border-color .6s, background .6s; }
  .tile.ok { border:2px solid var(--green); }
  .tile.bad { border:2px solid var(--red); }
  .tile.dead { opacity:.4; filter:grayscale(1); }
  .tile.won { border:2px solid var(--green); background:var(--green-soft); }
  .ico { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--blue-soft); color:var(--blue); }
  .ico.round { border-radius:50%; }
  .ico.grey { background:#EEF0F3; color:var(--mute); }
  .ico.red { background:var(--red-soft); color:var(--red); }
  .tname { font-weight:700; font-size:17px; }
  .tsub { font-size:13px; color:var(--mute); }
  .big { font-size:34px; font-weight:800; letter-spacing:-.02em; margin-left:auto; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700; padding:5px 12px; border-radius:99px; background:#EEF0F3; color:var(--ink); }
  .pill.hot { background:var(--red); color:#fff; }

  #hub { align-self:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #hub .shield { width:84px; height:84px; border-radius:24px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center;
                 transition:background .5s; }
  #hub.bad .shield { background:var(--red); } #hub.good .shield { background:var(--green); }
  #hubSt { font-size:15px; font-weight:700; color:var(--mute); min-height:21px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 18px; }
  .grid { display:grid; grid-template-columns:1fr 84px 84px; gap:10px 8px; align-items:center; }
  .grid .lbl { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; }
  .grid .lbl .ico { width:36px; height:36px; border-radius:10px; }
  .grid .hd { text-align:center; font-size:13px; font-weight:700; color:var(--mute); }
  .res { display:flex; flex-direction:column; align-items:center; font-size:12px; color:var(--mute); }
  .badge { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#EEF0F3; color:var(--mute); font-weight:800; font-size:13px; }
  .badge.good { background:var(--green); color:#fff; } .badge.bad { background:var(--red); color:#fff; }
  .spin { width:22px; height:22px; border-radius:50%; border:3px solid #C9D8F5; border-top-color:var(--blue); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .vs { display:flex; align-items:center; justify-content:center; gap:18px; padding:6px 0; }
  .vs .n { font-size:46px; font-weight:800; letter-spacing:-.03em; }
  .vs .cap { font-size:13px; color:var(--mute); text-align:center; }
  .doc { position:relative; padding:14px 18px; }
  .doc-h { display:flex; align-items:center; gap:8px; font-weight:700; }
  .doc-t { font-size:20px; font-weight:800; margin:6px 0 8px; }
  .bars i { display:block; height:7px; border-radius:4px; background:#EEF0F3; margin:6px 0; }
  .bars i:nth-child(2) { width:85%; } .bars i:nth-child(3) { width:60%; }
  .hidden-line { color:#FBFBFB; font-size:7px; line-height:1.3; transition:all 1.4s ease; border-radius:10px; }
  .hidden-line.shown { color:#7E1218; font-size:15px; font-weight:600; background:var(--red-soft); padding:8px 10px; margin-top:4px; }
  .doc-cap { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px; font-weight:700; color:var(--mute); }
  .doc-cap.alarm { color:var(--red); }
  .vs.compact { padding:2px 0; } .vs.compact .n { font-size:38px; }
  .say { font-size:15px; font-style:italic; color:var(--ink); }
  .tile.warn { border:2px solid #C98A00; background:#FFF8E6; }
  .deal { flex-direction:column; align-items:flex-start; gap:4px; }
  .thread { display:flex; flex-direction:column; gap:7px; padding:12px 16px; }
  .thread .hd { display:flex; justify-content:space-between; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .bub { max-width:85%; padding:6px 13px; border-radius:14px; font-size:13px; white-space:nowrap; }
  .bub b { font-size:19px; letter-spacing:-.01em; margin-right:6px; }
  .bub.me { align-self:flex-start; background:var(--blue-soft); color:#13306F; border-bottom-left-radius:4px; }
  .bub.them { align-self:flex-end; background:#EEF0F3; color:var(--ink); border-bottom-right-radius:4px; text-align:right; }
  .bub.yes { background:var(--green); color:#fff; }

  /* perspective switch */
  .seg { display:inline-flex; background:#E6E9EE; border-radius:99px; padding:3px; margin-top:10px; }
  .seg button { font:inherit; font-size:14px; font-weight:700; border:0; background:transparent; color:var(--mute); padding:6px 16px; border-radius:99px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(16,36,62,.15); }
  #persp { flex:1; min-height:0; display:none; align-items:center; justify-content:center; padding:10px 28px; }
  body[data-view="j"] main, body[data-view="l"] main { display:none; }
  body[data-view="j"] #persp, body[data-view="l"] #persp { display:flex; }
  .dev-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; max-height:100%; }
  .dev-label { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .phone { width:340px; height:520px; border:10px solid #121826; border-radius:42px; background:#fff; overflow:hidden; box-shadow:0 18px 40px rgba(16,36,62,.18); }
  .phone-screen { height:100%; padding:20px 16px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
  .p-h { font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .pcard { border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:#fff; transition:background .6s, border-color .6s; }
  .pcard.okc { border-color:var(--green); background:var(--green-soft); }
  .pcard.badc { border:2px solid var(--red); background:var(--red-soft); color:#7E1218; }
  .p-row { display:flex; align-items:center; gap:10px; }
  .p-row .big { font-size:26px; }
  .ico.sm { width:38px; height:38px; border-radius:11px; }
  .tog { margin-left:auto; width:44px; height:26px; border-radius:99px; background:#C9CED6; position:relative; transition:background .4s; flex-shrink:0; }
  .tog::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .4s; }
  .tog.on { background:var(--green); } .tog.on::after { left:21px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
  .chips span { font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--blue-soft); color:#1A3F99; }
  .orow { padding:7px 0; border-top:1px solid var(--line); font-size:15px; } .orow:first-of-type { border-top:0; }
  .orow .on { flex:1; } .orow b { font-size:18px; } .orow.dead { opacity:.45; }
  .red { color:var(--red); }
  .dash { width:820px; max-width:100%; height:470px; border-radius:16px; border:1px solid var(--line); background:#fff; overflow:hidden;
          display:flex; flex-direction:column; box-shadow:0 18px 40px rgba(16,36,62,.14); }
  .dash-top { background:var(--navy); color:#fff; padding:11px 16px; display:flex; align-items:center; gap:10px; font-size:14px; }
  .dash-top span { color:#C9D3E3; }
  .dash.evil .dash-top { background:#5C1015; }
  .simtag { margin-left:auto; font-size:11px; font-weight:700; color:#6B4700 !important; background:#FFF4D6; border-radius:4px; padding:1px 6px; }
  .dash-body { flex:1; min-height:0; padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .dcard { border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .dcard h3 { margin:0; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .redact { display:inline-block; background:#121826; color:transparent; border-radius:3px; user-select:none; }
  .kv2 { display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:15px; } .kv2 .v { font-weight:700; text-align:right; }
  .verdict-bad { border:2px solid var(--red); background:var(--red-soft); color:#7E1218; }
  .verdict-ok { border:2px solid var(--green); background:var(--green-soft); color:#0E5233; }

  #fx { position:fixed; inset:0; pointer-events:none; z-index:50; }
  .token { position:fixed; left:0; top:0; padding:7px 14px; border-radius:99px; background:var(--blue); color:#fff; font-size:15px; font-weight:800;
           white-space:nowrap; box-shadow:0 8px 22px rgba(16,36,62,.28); }
  .token.good { background:var(--green); } .token.bad { background:var(--red); } .token.grey { background:#6B7480; }
  .stamp { position:absolute; right:12px; top:-12px; border:3px solid currentColor; border-radius:8px; padding:2px 10px; font-weight:900;
           letter-spacing:.06em; font-size:17px; background:#fff; transform:rotate(-8deg); }
  .stamp.good { color:var(--green); } .stamp.bad { color:var(--red); }
  .stamp.center { position:static; display:inline-block; font-size:30px; padding:4px 18px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <div class="brand">Agent credit exchange</div>
  <span id="src"><i></i><span>Connecting</span></span>
  <nav aria-label="Demo scenes" id="steps"></nav>
</header>

<section class="intro"><h1 id="title" aria-live="polite">Loading...</h1><p id="caption"></p>
  <div class="seg" role="group" aria-label="Whose view">
    <button type="button" data-view="all" aria-pressed="true">Everyone</button>
    <button type="button" data-view="j" aria-pressed="false">Jasmine</button>
    <button type="button" data-view="l" aria-pressed="false">Lender</button>
  </div>
</section>
<div id="persp"></div>

<main>
  <section class="lane" aria-label="Borrower"><div class="lane-t">Borrower</div><div id="B" class="lane"></div></section>
  <section class="lane" aria-label="Referee"><div class="lane-t">Referee · CRS data</div>
    <div id="hub"><div class="shield" data-icon="shield"></div><div id="hubSt"></div></div>
    <div id="R" class="lane"></div></section>
  <section class="lane" aria-label="Lenders"><div class="lane-t">Lenders</div><div id="L" class="lane"></div></section>
</main>

<footer>
  <button id="back" type="button">Back</button>
  <div class="fine">Fictional CRS sandbox personas · simulated lenders and settlement</div>
  <button id="next" type="button"><span id="nextLbl">Next</span><span data-icon="arrow"></span></button>
</footer>
<div id="fx" aria-hidden="true"></div>

<script>
// ------------------------------------------------------------------ helpers
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {  // strings become text nodes: agent text can never inject markup
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") el.className = v; else if (v != null && v !== false) el.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const ICONS = {
  check: '<path d="M5 12l5 5L20 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  bank: '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/>',
  id: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M14 10h4M14 13h3"/>',
  alert: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16h.01"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  gauge: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/>',
  hidden: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/><path d="M3 3l18 18"/>',
  warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>',
  robot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 17h5"/>',
  eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};
function icon(name, size = 24) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  for (const [k, v] of Object.entries({width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true"})) s.setAttribute(k, v);
  s.innerHTML = ICONS[name];  // static icon paths only
  return s;
}
document.querySelectorAll("[data-icon]").forEach(e => e.append(icon(e.dataset.icon, e.dataset.icon === "shield" ? 44 : 20)));
const money = (n, d = 0) => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = n => (Math.round(n * 10) / 10).toFixed(1) + "%";
const first = name => String(name || "").split(" ")[0];
const get = async u => { const r = await fetch(u); if (!r.ok) throw new Error(`${r.status} ${u}`); return r.json(); };

// ------------------------------------------------------------------ animation engine
// goTo(n) replays scenes 0..n-1 instantly (speed 0), then plays scene n. A newer goTo cancels the old one.
const STOP = Symbol("stop"), reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let run = 0, speed = 1, cur = 0;
const alive = id => { if (id !== run) throw STOP; };
async function wait(ms) { const id = run; if (speed) await new Promise(r => setTimeout(r, ms * speed)); alive(id); }
async function anim(el, kf, ms, easing = "cubic-bezier(.2,.8,.2,1)") {
  const id = run, a = el.animate(kf, {duration: speed ? ms * speed : 0, easing, fill: "forwards"});
  try { await a.finished; } catch (e) { /* cancelled */ }
  alive(id); return a;
}
const appear = el => anim(el, [{opacity: 0, transform: "translateY(12px)"}, {opacity: 1, transform: "none"}], 600);
const vanish = el => anim(el, [{opacity: 1}, {opacity: 0, transform: "scale(.96)"}], 500).then(() => el.remove());
function shake(el) { if (speed && !reduced) el.animate([{transform: "translateX(0)"}, {transform: "translateX(-8px)"}, {transform: "translateX(8px)"},
  {transform: "translateX(-5px)"}, {transform: "translateX(0)"}], {duration: 420}); }
async function countTo(el, from, to, ms, fmt) {
  const id = run;
  if (!speed) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = ms * speed;
  await new Promise(res => { const step = now => { if (id !== run) return res(); const k = Math.min(1, (now - t0) / d), e = 1 - (1 - k) ** 3;
    el.textContent = fmt(from + (to - from) * e); k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
  alive(id);
}
async function stamp(where, text, tone, cls = "") {
  const s = h("div", {class: `stamp ${tone} ${cls}`}, text);
  where.append(s);
  await anim(s, [{transform: "rotate(-8deg) scale(2.6)", opacity: 0}, {transform: "rotate(-8deg) scale(1)", opacity: 1}], 520, "cubic-bezier(.3,1.5,.5,1)");
  if (tone === "bad") shake(where);
  await wait(600);
}
function hub(text, tone = "") { $("#hubSt").textContent = text; $("#hub").className = tone; }
const center = el => { const r = el.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
const at = (p, extra = "") => `translate(${p.x}px, ${p.y}px) translate(-50%, -50%) ${extra}`;
// A message token flies from sender to the referee, pauses while it's checked, then on to the receiver (or stops there).
async function fly(from, to, label, tone = "", stopAtHub = false) {
  if (!speed || reduced) return null;
  const t = h("div", {class: "token " + tone}, label), shield = $("#hub .shield");
  $("#fx").append(t);
  try {
    const a = center(from), b = center(shield);
    await anim(t, [{transform: at(a, "scale(.5)"), opacity: 0}, {transform: at(a), opacity: 1, offset: .12}, {transform: at(b), opacity: 1}], 1100);
    shield.animate([{transform: "scale(1)"}, {transform: "scale(1.1)"}, {transform: "scale(1)"}], {duration: 500});
    await wait(650);
    if (stopAtHub) return t;
    const c = center(to);
    await anim(t, [{transform: at(b), opacity: 1}, {transform: at(c, "scale(.9)"), opacity: 1, offset: .85}, {transform: at(c, "scale(.5)"), opacity: 0}], 950);
    t.remove(); return null;
  } catch (e) { t.remove(); throw e; }
}
async function dropToken(t) {
  if (!t) return;
  const base = getComputedStyle(t).transform;
  try { await anim(t, [{transform: base, opacity: 1}, {transform: base + " translateY(60px) rotate(16deg)", opacity: 0}], 700); } finally { t.remove(); }
}

// ------------------------------------------------------------------ tiles
let D = {}, LENDERS = {};
function person(d, initials, fake) {
  const score = Math.min(...Object.values(d.scores).filter(x => x != null));
  return h("div", {class: "tile", id: fake ? "pK" : "pJ"},
    h("div", {class: "ico round" + (fake ? " grey" : "")}, icon("user", 28)),
    h("div", {}, h("div", {class: "tname"}, fake ? `"${d.name}"` : d.name), h("div", {class: "tsub"}, "credit score")),
    h("div", {class: "big"}, String(score)));
}
function lender(id) {
  return h("div", {class: "tile", id: "l-" + id}, h("div", {class: "ico grey"}, icon("bank", 26)),
    h("div", {}, h("div", {class: "tname"}, LENDERS[id] || id), h("div", {class: "tsub st"}, "waiting")),
    h("div", {class: "big rate", hidden: ""}));
}
const L = id => $("#l-" + id);

function reset() {
  $("#fx").replaceChildren(); $("#B").replaceChildren(); $("#R").replaceChildren(); $("#L").replaceChildren();
  hub("");
  for (const id of D.lenderIds) $("#L").append(lender(id));
}

// ------------------------------------------------------------------ scene 1: who's real?
function checks(J, K) {
  const ff = d => d.fraud_finder || {};

  const open = D.msgs.find(e => e.round === 0 && e.data.sender === lid && e.data.type === "OFFER");
  if (open) await say(false, pct(open.data.terms.apr), "your offer");
  for (const e of D.msgs.filter(x => x.round > blocked && (x.data.sender === lid || x.data.to === lid))) {
    const d = e.data, mine = d.sender === "borrower";
    if (d.type === "ACCEPT") await say(true, "Accepted", pct(d.terms.apr), true);
    else if (mine && d.terms) await say(true, `${pct(d.terms.apr)}?`, d.terms.autopay ? "with autopay" : "");
    else if (d.type === "OFFER") await say(false, pct(d.terms.apr), "you agreed");
  }
  if (!D.ex.deal) return;
  const t = D.ex.deal.terms;
  await add(s, h("div", {class: "dcard verdict-ok"}, h("div", {class: "p-row"}, icon("check", 22), h("b", {style: "font-size:20px"}, "New loan")),
    h("div", {style: "font-size:26px;font-weight:800"}, `${money(t.amount)} at ${pct(t.apr)}`),
    h("div", {class: "p-row tsub"}, h("span", {class: "simtag", style: "margin:0"}, "SIMULATED"), "full credit file unlocked, funding, bureau reporting")));
}
const VIEWS = {j: [jScene1, jScene2, jScene3, jScene4], l: [lScene1, lScene2, lScene3, lScene4]};
let view = "all";
function setView(v) {
  view = v; document.body.dataset.view = v;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  goTo(cur);
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setView(b.dataset.view));

// ------------------------------------------------------------------ scenes + controls
const SCENES = [
  {title: "Who's real?", caption: "Same thin file. CRS data tells them apart.", fn: scene1},
  {title: "Offers arrive", caption: "Lenders see a passport, not her identity.", fn: scene2},
  {title: "An attack", caption: "A hidden instruction tricks her agent.", fn: scene3},
  {title: "The deal", caption: "Negotiated inside her limit.", fn: scene4},
];
$("#steps").replaceChildren(...SCENES.map((s, i) => { const b = h("button", {type: "button", title: s.title, "aria-label": s.title}, String(i + 1)); b.onclick = () => goTo(i); return b; }));

async function goTo(n) {
  n = Math.max(0, Math.min(SCENES.length - 1, n));
  if (!D.msgs) return;  // data still loading
  const id = ++run; cur = n;
  [...$("#steps").children].forEach((b, i) => i === n ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
  $("#title").textContent = SCENES[n].title; $("#caption").textContent = SCENES[n].caption;
  $("#nextLbl").textContent = n < SCENES.length - 1 ? "Next" : "Start over";
  $("#back").disabled = n === 0;
  try {
    speed = 0; reset(); $("#persp").replaceChildren();
    if (view !== "all") { speed = 1; await VIEWS[view][n](); return; }
    for (let i = 0; i < n; i++) await SCENES[i].fn();
    speed = 1; await SCENES[n].fn();
  } catch (e) { if (e !== STOP) throw e; }
  finally { if (id === run) speed = 1; }
}
$("#next").onclick = () => goTo(cur < SCENES.length - 1 ? cur + 1 : 0);
$("#back").onclick = () => goTo(cur - 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goTo(cur < SCENES.length - 1 ? cur + 1 : 0); }
  else if (e.key === "ArrowLeft") goTo(cur - 1);
  else if (e.key === "r" || e.key === "R") goTo(cur);
});

// Live CRS sandbox by default; /demo?live=0 uses the saved sandbox responses. The server falls back to saved data
// on any live failure, and the badge shows what was actually used.
function showSource(J, K, ex) {
  const gate = ex.events.find(e => e.kind === "gate"), srcs = [J.source, K.source, gate ? gate.data.source : "samples"];
  const live = srcs.filter(s => s === "live").length, el = $("#src");
  el.className = live === srcs.length ? "live" : "";
  el.querySelector("span").textContent = live === srcs.length ? "Live · CRS sandbox" : live ? "Partly live · CRS sandbox" : "Saved CRS sandbox data";
  el.title = J.live_note || K.live_note || ex.live_note || "";
}

(async () => {
  const q = new URLSearchParams(location.search).get("live") === "0" ? "" : "live=1";
  $("#title").textContent = q ? "Pulling live CRS data..." : "Loading...";
  try {
    const [J, K, ex, sc] = await Promise.all([get(`/api/decide/P03?${q}`), get(`/api/decide/P13?${q}`),
                                              get(`/api/exchange/P03?scenario=demo&${q}`), get("/api/exchange/scenarios")]);
    showSource(J, K, ex);
    LENDERS = sc.lenders || {};
    const msgs = ex.events.filter(e => e.kind === "message");
    D = {J, K, ex, msgs, lenderIds: [...new Set(msgs.filter(e => e.data.sender !== "borrower").map(e => e.data.sender))]};
    goTo(0);
  } catch (err) {
    $("#title").textContent = "Couldn't load the market";
    $("#caption").textContent = err.message + ". Is the server running?";
  }
})();
</script>
